[project]
name = "babylm-2026"
version = "0.1.0"
description = "Register/complexity simplification and age-of-acquisition analysis on the BabyLM 2026 Strict-Small corpus"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Deep Pambhar" },
    { name = "Alessio Piroli" },
    { name = "Nour Hadjfredj" },
]
dependencies = [
    "jupyter",
    "pandas",
    "matplotlib",
    "datasets",
    "requests",
    "spacy",
    "torch",
    "transformers",
    "statsmodels",
    "lemminflect",
    "macro-etym @ git+https://github.com/JonathanReeve/macro-etym",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
